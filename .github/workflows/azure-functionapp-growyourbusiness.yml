name: Deploy GYB API to Function App

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/azure-functionapp-growyourbusiness.yml"
  workflow_dispatch:

jobs:
  deploy_api:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Windows Function Apps do not use Linux remote-build; ship production node_modules.
      - name: Install production dependencies
        working-directory: api
        run: npm ci --omit=dev

      # Large packages make Kudu ZipDeploy time out while extracting ("Thread was being aborted").
      - name: Prune files not needed at runtime
        working-directory: api
        run: |
          echo "Files before prune: $(find . -type f | wc -l)"
          find node_modules -type d \( \
            -path "*/dist/browser" -o -path "*/dist/react-native" -o \
            -name test -o -name tests -o -name __tests__ -o \
            -name docs -o -name example -o -name examples -o -name .github \
          \) -prune -exec rm -rf {} +
          find node_modules -type f \( \
            -name "*.map" -o -name "*.d.ts" -o -name "*.d.mts" -o -name "*.d.cts" -o \
            -name "*.md" -o -name "*.markdown" \
          \) -delete
          echo "Files after prune: $(find . -type f | wc -l)"

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: growyourbusiness-api-in
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_GYB_IN }}
          respect-funcignore: true
