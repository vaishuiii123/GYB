name: Deploy GYB API to Function App

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/azure-functionapp-growyourbusiness.yml"
  workflow_dispatch:

jobs:
  deploy_api:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Windows Function Apps do not use Linux remote-build; ship production node_modules.
      - name: Install production dependencies
        working-directory: api
        run: npm ci --omit=dev

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: growyourbusiness-api
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_GYB }}
          respect-funcignore: true
