name: Deploy GYB API to Function App

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
  workflow_dispatch:

jobs:
  deploy_api:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: growyourbusiness
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_GYB }}
